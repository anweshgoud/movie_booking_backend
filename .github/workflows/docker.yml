name: Build and Deploy Backend
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t anweshanthati/movie_booking_backend:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push anweshanthati/movie_booking_backend:${{ github.sha }}

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/movie-booking-github-actions
          chmod 600 ~/.ssh/movie-booking-github-actions

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/movie-booking-github-actions \
            $VM_USER@$VM_HOST \
            "cd ~ && \
             sed -i 's/^BACKEND_IMAGE_TAG=.*/BACKEND_IMAGE_TAG=$IMAGE_TAG/' .env && \
             docker compose pull springboot && \
             docker compose up -d springboot"
      
      
      - name: Verify Backend Health
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/movie-booking-github-actions \
            $VM_USER@$VM_HOST \
            '
            echo "Waiting for backend to become healthy..."

            for i in {1..12}; do
              if curl --fail --silent --show-error http://localhost:8080/actuator/health; then
                echo ""
                echo "Backend is healthy!"
                exit 0
              fi

              echo "Backend not ready yet. Attempt $i/12"
              sleep 10
            done

            echo "Backend failed health check."
            docker logs --tail 100 movie-booking-api
            exit 1
            '